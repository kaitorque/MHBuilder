name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mhbuilder

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: the Portainer stack's webhook URL, to redeploy once the image is published.
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tests run inside the Dockerfile, so a failing test fails this step and nothing is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Portainer
        if: ${{ env.PORTAINER_WEBHOOK != '' }}
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"

# Portainer: Stacks > Add stack > Repository (or paste this file into the Web editor).
# The image is built and published by GitHub Actions (.github/workflows/docker.yml); nothing is built on the server.
# MHBUILDER_PORT (default 5188) is the host port the web UI is published on.
services:
  mhbuilder:
    image: ghcr.io/kaitorque/mhbuilder:latest
    pull_policy: always
    container_name: mhbuilder
    ports:
      - "${MHBUILDER_PORT:-5188}:8080"
    restart: unless-stopped
